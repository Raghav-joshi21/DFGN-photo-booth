<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DFGN Photo Booth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon works as a maskable icon too. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Camera body (kept inside the maskable safe zone ~ central 80%). -->
  <g fill="#FFFFFF">
    <rect x="116" y="176" width="280" height="204" rx="30"/>
    <!-- Viewfinder bump -->
    <path d="M212 176 l16 -28 a12 12 0 0 1 10 -6 h36 a12 12 0 0 1 10 6 l16 28 z"/>
  </g>
  <!-- Lens -->
  <circle cx="256" cy="282" r="66" fill="#7C3AED"/>
  <circle cx="256" cy="282" r="40" fill="#F9A8D4"/>
  <circle cx="234" cy="260" r="12" fill="#FFFFFF" opacity="0.9"/>
  <!-- Flash -->
  <rect x="330" y="196" width="34" height="20" rx="6" fill="#FDE68A"/>
</svg>
